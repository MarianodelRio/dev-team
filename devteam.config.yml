# devteam.config.yml
# Framework configuration for dev-team.
# Edit this file to customize how the framework works for your project.
# All settings have sensible defaults — you only need to change what you want different.

devteam_version: "1.4.0"          # Framework version

# ─────────────────────────────────────────
# PROJECT
# ─────────────────────────────────────────
project:
  name: ""                        # Your project name
  stack: ""                       # Primary language/stack. Valid values: python, typescript, go, rust, mixed.
  type: ""                        # Project shape. Valid values: rest-api, cli, library, data-ml, frontend, mixed.

# ─────────────────────────────────────────
# MODEL CONFIGURATION
# ─────────────────────────────────────────
model:
  reasoning: claude-fable-5       # Model for design decisions, architecture, and Advisor consultations. Recommended: most capable model available.
  implementation: claude-sonnet-4-6  # Model for writing code and implementing tasks.
  fast: claude-haiku-4-5          # Model for project-specific agents generated by /bootstrap. Note: /team-init Section E writes changes here and updates matching agent frontmatter files.

# ─────────────────────────────────────────
# WORKFLOW
# ─────────────────────────────────────────
workflow:
  pr_mode: automatic              # How PRs are created by /orchestrate Phase 4 and /prepare-pr. Valid values: automatic, manual.
  human_checkpoint: before_code   # When the human checkpoint triggers during /orchestrate. Valid values: before_code, before_pr, both.
  require_advisor: high_risk      # When to invoke the Advisor agent (uses reasoning model, more expensive). Valid values: high_risk, always, never. PLANNED: not yet implemented.
  cleanup_merged_branches: true   # Delete merged feature branches from origin automatically after /done. Valid values: true, false.
  auto_merge: off                 # Auto-merge after all checks pass. Valid values: off, on. Not yet implemented.

# ─────────────────────────────────────────
# ORCHESTRATION
# ─────────────────────────────────────────
orchestration:
  # orchestrator_model: ""        # Model used by the Orchestrator. Defaults to model.reasoning if not set.
  # planner_model: ""             # Model used by the Planner sub-agent. Defaults to model.implementation if not set.
  # coder_model: ""               # Model used by the Coder sub-agent. Defaults to model.implementation if not set.
  timeout_s: 120                  # Timeout for S-size tasks before /restart is suggested (minutes). PLANNED: not yet implemented.
  timeout_m: 240                  # Timeout for M-size tasks before /restart is suggested (minutes). PLANNED: not yet implemented.
  timeout_l: 480                  # Timeout for L-size tasks before /restart is suggested (minutes). PLANNED: not yet implemented.
  max_rebase_auto_retries: 2      # Maximum rebase conflict resolution attempts before escalating to human. PLANNED: not yet implemented.
  max_blocker_retries: 2          # Maximum times the Orchestrator sends a blocker back to the Coder before escalating.
  max_parallel_tasks: 5           # Maximum tasks in-progress simultaneously.

# ─────────────────────────────────────────
# QUALITY GATES
# ─────────────────────────────────────────
quality:
  coverage_threshold: 70          # Minimum test coverage on core modules (0-100). PLANNED: not yet implemented.
  review_profile: auto            # Controls which review sub-agents the review-coordinator runs. Valid values: full, fast, auto.
  require_security_scan: true     # Run OWASP security scan on every PR diff. Valid values: true, false. PLANNED: not yet implemented.
  require_smoke_tests: true       # Spin up the app and test acceptance criteria. Valid values: true, false. PLANNED: not yet implemented.
  smoke_test_mode: sandbox        # Smoke test execution mode. Valid values: sandbox, live.
  require_mutation_tests: false   # Enable mutation testing (introduces deliberate bugs to verify test quality). Valid values: true, false.
  mutation_score_threshold: 80    # Mutation test threshold (0-100). Only used if require_mutation_tests: true.
  critical_modules: []            # Modules where mutation testing always runs regardless of require_mutation_tests. Populated by /bootstrap from design.md.
  spec_coverage_enabled: false    # Run spec-coverage agent in parallel with reviewers. Maps spec.md Logic+Interface constraints to tests in the PR diff. Advisory only — never blocks. Valid values: true, false.
  spec_coverage_threshold: 80     # Minimum % of spec constraints covered by tests before WARN_LOW verdict. Range: 0-100. Only used when spec_coverage_enabled: true.

# ─────────────────────────────────────────
# COMMANDS
# ─────────────────────────────────────────
commands:
  test: ""          # Command to run tests. Auto-detected from project files if empty.
  lint: ""          # Command to lint the project. Auto-detected from project files if empty.
  type_check: ""    # Command to type-check the project. Auto-detected from project files if empty.
  run: ""           # Command to start the project. Auto-detected from project files if empty.

# ─────────────────────────────────────────
# BATTERIES
# ─────────────────────────────────────────
batteries:
  docker: true              # Generate Docker Compose + Dockerfile. Valid values: true, false.
  ci: true                  # Generate .github/workflows/ci.yml. Valid values: true, false.
  env_example: true         # Generate .env.example with all required variables. Valid values: true, false.
  contributing: true        # Generate CONTRIBUTING.md and CODE_OF_CONDUCT.md. Valid values: true, false.
  security_policy: true     # Generate SECURITY.md with vulnerability reporting instructions. Valid values: true, false.
  github_templates: true    # Generate GitHub PR and Issue templates. Valid values: true, false.
  test_scaffold: true       # Scaffold the test structure decided in design.md Testing strategy. Valid values: true, false.

# ─────────────────────────────────────────
# MEMORY
# ─────────────────────────────────────────
memory:
  retrospective_memory_enabled: true  # Persist lessons learned from completed tasks in context/retrospectives/.
                                      # Lessons extracted at /done, injected into coder/planner/architect in
                                      # /orchestrate Phase 0. Valid values: true, false.

# ─────────────────────────────────────────
# TASKS
# ─────────────────────────────────────────
tasks:
  max_auto_size: L           # Maximum task size the Orchestrator will pick without asking. Valid values: S, M, L. PLANNED: not yet implemented.
